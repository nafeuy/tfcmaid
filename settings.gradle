pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository { maven { url = 'https://maven.neoforged.net/releases' } }
            filter { includeGroupAndSubgroups 'net.neoforged' }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'tfcmaid'
